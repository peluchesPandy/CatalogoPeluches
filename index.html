<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peluches | Pandy 🧸</title>

  <!-- FUENTES DE GOOGLE -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@700&family=Poppins:wght@400;600;700&family=Sniglet:wght@800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* PALETA DE COLORES SUAVES */
      --blanco: #FFFFFF;
      --bg-principal: #FAFAFA;
      
      --naranja-suave: #FFE5D9;
      --naranja-borde: #FCD5CE;
      --rosa-suave: #FEC89A;
      --rosa-pastel: #FFD7BA;
      --verde-suave: #E8F5E9;
      --verde-borde: #C8E6C9;
      --azul-suave: #E3F2FD;
      --azul-borde: #BBDEFB;
      
      --texto-oscuro: #333333;
      --texto-gris: #666666;
      --rojo-corazon: #E53935;
      --sombra: rgba(0, 0, 0, 0.04);

      --fuente-normal: 'Poppins', system-ui, -apple-system, sans-serif;
      --fuente-burbuja: 'Sniglet', 'Mali', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--fuente-normal);
      color: var(--texto-oscuro);
    }

    body {
      background-color: var(--bg-principal);
      padding-bottom: 40px;
    }

    /* CONTENEDOR DE BARRAS FIJAS SUPERIORES */
    .header-fijo {
      position: sticky;
      top: 0;
      z-index: 90;
      background-color: var(--blanco);
      box-shadow: 0 2px 6px var(--sombra);
    }

    /* 1. BARRA PRINCIPAL (LOGO Y MENÚ HAMBURGUESA) */
    .navbar-principal {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #F0F0F0;
    }

    .btn-menu-hamburguesa {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      color: var(--texto-oscuro);
    }

    .logo-tienda {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .img-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      border-radius: 4px;
    }

    .titulo-marca {
      font-size: 1.1rem;
      font-weight: 800;
      font-family: var(--fuente-burbuja);
      color: var(--texto-oscuro);
    }

    /* 2. BARRA SECUNDARIA DELGADITA DEBAJO (ÍCONOS A LA DERECHA) */
    .subbar-iconos {
      padding: 4px 16px;
      display: flex;
      justify-content: flex-end; /* ALINEA LOS ÍCONOS A LA DERECHA */
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--naranja-borde);
      background-color: #FCFCFC;
    }

    .btn-icon-subbar {
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .btn-icon-subbar:hover {
      background-color: var(--azul-suave);
    }

    .icono-png-subbar {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .texto-subbar-icon {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--texto-oscuro);
    }

    .btn-icon-subbar .badge-count {
      background-color: var(--rojo-corazon);
      color: white;
      font-size: 0.6rem;
      font-weight: 800;
      min-width: 15px;
      height: 15px;
      border-radius: 10px;
      padding: 0 3px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    /* ENCABEZADO CON TÍTULO Y FRASE */
    .encabezado-seccion {
      text-align: center;
      padding: 15px 15px 10px 15px;
    }

    .titulo-catalogo {
      font-family: var(--fuente-burbuja);
      font-size: 1.6rem;
      margin-bottom: 2px;
      color: var(--texto-oscuro);
    }

    .frase-catalogo {
      font-size: 0.8rem;
      font-style: italic;
      color: var(--texto-gris);
      margin-bottom: 12px;
    }

    .contenedor-buscador {
      max-width: 480px;
      margin: 0 auto;
    }

    #buscador {
      width: 100%;
      padding: 8px 16px;
      border: 1px solid var(--azul-borde);
      border-radius: 20px;
      outline: none;
      font-size: 0.85rem;
      background-color: var(--blanco);
    }

    .contenedor-tienda {
      max-width: 1200px;
      margin: 12px auto;
      padding: 0 12px;
    }

    /* GRID ESTILO MINISO */
    .grid-productos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 768px) {
      .grid-productos {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }
    }

    /* TARJETA DE PRODUCTO */
    .card {
      background: var(--blanco);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      border: 1px solid var(--naranja-borde);
      box-shadow: 0 2px 6px var(--sombra);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s ease;
    }

    .insignia-fueguito {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--verde-suave);
      border: 1px solid var(--verde-borde);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      z-index: 5;
    }

    .btn-corazon-card {
      position: absolute;
      top: 6px;
      right: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 5;
      padding: 2px;
    }

    .btn-corazon-card svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #1A1A1A;
      stroke-width: 2;
    }

    .btn-corazon-card.activo svg {
      fill: var(--rojo-corazon);
      stroke: var(--rojo-corazon);
    }

    .card img.img-producto {
      width: 100%;
      height: 130px;
      object-fit: contain;
      border-radius: 8px;
    }

    .card h3 {
      font-size: 0.88rem;
      margin: 6px 0 2px 0;
      font-weight: 700;
    }

    .card p.descripcion-corta {
      font-size: 0.72rem;
      color: var(--texto-gris);
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* BOTÓN LLEVAR A MI BOLSA */
    .btn-llevar {
      background-color: var(--naranja-suave);
      color: var(--texto-oscuro);
      border: 1px solid var(--naranja-borde);
      padding: 6px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* PANELS DESPLEGABLES */
    .desplegable-panel {
      position: fixed;
      top: 0;
      left: -100%;
      width: 280px;
      max-width: 80vw;
      height: 100%;
      background-color: var(--blanco);
      box-shadow: 4px 0 15px rgba(0,0,0,0.1);
      z-index: 180;
      transition: left 0.3s ease, right 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .desplegable-panel.derecha {
      left: auto;
      right: -100%;
    }

    .desplegable-panel.activo {
      left: 0;
    }

    .desplegable-panel.derecha.activo {
      right: 0;
    }

    .cabecera-panel {
      padding: 12px;
      background-color: var(--azul-suave);
      border-bottom: 1px solid var(--azul-borde);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cuerpo-panel {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .pie-panel {
      padding: 12px;
      border-top: 1px solid var(--naranja-borde);
    }

    .grupo-filtro {
      margin-bottom: 12px;
    }

    .grupo-filtro label {
      display: block;
      font-size: 0.8rem;
      color: var(--texto-oscuro);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .grupo-filtro select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--azul-borde);
      background-color: var(--blanco);
      outline: none;
      font-size: 0.8rem;
    }

    /* MODAL CANTIDAD */
    .modal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-contenido {
      background-color: var(--blanco);
      border-radius: 16px;
      padding: 16px;
      max-width: 350px;
      width: 100%;
      position: relative;
    }

    .cerrar-modal {
      position: absolute;
      right: 12px;
      top: 8px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .selector-cantidad {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 12px 0;
    }

    .selector-cantidad button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--azul-borde);
      background: var(--azul-suave);
      cursor: pointer;
      font-weight: bold;
    }

    .btn-accion-panel {
      width: 100%;
      background-color: #25D366;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
    }

    .icono-png-inline {
      width: 18px;
      height: 18px;
      object-fit: contain;
      vertical-align: middle;
    }

    .item-panel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #EEE;
    }

    .item-panel img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO FIJO DE DOS BARRAS -->
  <header class="header-fijo">
    <!-- BARRA 1: TRES LÍNEAS + LOGO CON TÍTULO COMPLETO -->
    <nav class="navbar-principal">
      <button class="btn-menu-hamburguesa" onclick="toggleMenuLateral()" title="Opciones de filtro">
        ☰
      </button>

      <div class="logo-tienda">
        <img src="imagenes/logo.jpeg" alt="Logo" class="img-logo" onerror="this.src='https://via.placeholder.com/32'">
        <span class="titulo-marca">Peluches | Pandy</span>
      </div>
    </nav>

    <!-- BARRA 2: SUBBARRA DELGADITA CON ÍCONOS A LA DERECHA -->
    <div class="subbar-iconos">
      <!-- WHATSAPP -->
      <a class="btn-icon-subbar" href="https://wa.me/573000000000" target="_blank" title="WhatsApp">
        <img src="imagenes/w.png" alt="WhatsApp" class="icono-png-subbar">
        <span class="texto-subbar-icon">WhatsApp</span>
      </a>

      <!-- FAVORITOS -->
      <button class="btn-icon-subbar" onclick="toggleFavoritos()" title="Favoritos">
        <img src="imagenes/c.png" alt="Favoritos" class="icono-png-subbar">
        <span class="badge-count" id="contador-favoritos">0</span>
      </button>

      <!-- MI BOLSA -->
      <button class="btn-icon-subbar" onclick="toggleCarrito()" title="Mi Bolsa">
        <img src="imagenes/m.png" alt="Carrito" class="icono-png-subbar">
        <span class="badge-count" id="contador-carrito">0</span>
      </button>
    </div>
  </header>

  <!-- MENÚ LATERAL (3 LÍNEAS) -->
  <div class="desplegable-panel" id="panel-menu-lateral">
    <div class="cabecera-panel">
      <h3>Opciones y Filtros</h3>
      <span style="cursor:pointer; font-size:1.2rem;" onclick="toggleMenuLateral()">&times;</span>
    </div>
    <div class="cuerpo-panel">
      <div class="grupo-filtro">
        <label for="filtro-origen">Tipo de Producto</label>
        <select id="filtro-origen" onchange="alSeleccionarTipo()">
          <option value="">Selecciona Tipo</option>
          <option value="Nacional">Nacional</option>
          <option value="Importado">Importado</option>
        </select>
      </div>

      <div class="grupo-filtro">
        <label for="filtro-tamano">Tamaño / Llavero</label>
        <select id="filtro-tamano" onchange="filtrarProductos()" disabled>
          <option value="">Primero selecciona tipo</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ENCABEZADO CON TÍTULO Y FRASE -->
  <div class="encabezado-seccion">
    <h1 class="titulo-catalogo">Catálogo de Peluches</h1>
    <p class="frase-catalogo">"Un abrazo siempre es del tamaño adecuado." A. A. Milne</p>

    <div class="contenedor-buscador">
      <input type="text" id="buscador" placeholder="¿Qué estás buscando hoy?" oninput="filtrarProductos()">
    </div>
  </div>

  <!-- TIENDA -->
  <div class="contenedor-tienda">
    <main class="grid-productos" id="catalogo"></main>
  </div>

  <!-- MODAL CANTIDAD -->
  <div id="modal-producto" class="modal">
    <div class="modal-contenido">
      <span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
      <h3 id="modal-titulo" style="text-align: center;"></h3>
      <p id="modal-descripcion" style="font-size: 0.8rem; color: var(--texto-gris); text-align: center; margin: 6px 0;"></p>
      
      <div class="selector-cantidad">
        <button onclick="cambiarCantidadModal(-1)">-</button>
        <span id="modal-cantidad" style="font-weight: bold;">1</span>
        <button onclick="cambiarCantidadModal(1)">+</button>
      </div>

      <button id="modal-btn-confirmar" class="btn-llevar" style="padding: 8px; font-size: 0.85rem;">
        Llevar a mi bolsa <img src="imagenes/m.png" alt="Carrito" class="icono-png-inline">
      </button>
    </div>
  </div>

  <!-- PANEL CARRITO -->
  <div class="desplegable-panel derecha" id="desplegable-carrito">
    <div class="cabecera-panel">
      <h3>Mi Bolsa</h3>
      <span style="cursor:pointer; font-size:1.2rem;" onclick="toggleCarrito()">&times;</span>
    </div>
    <div class="cuerpo-panel" id="items-carrito"></div>
    <div class="pie-panel">
      <button class="btn-accion-panel" onclick="enviarWhatsApp()">
        Pedir por WhatsApp <img src="imagenes/w.png" alt="WhatsApp" class="icono-png-inline">
      </button>
    </div>
  </div>

  <!-- PANEL FAVORITOS -->
  <div class="desplegable-panel derecha" id="desplegable-favoritos">
    <div class="cabecera-panel">
      <h3 style="display: flex; align-items: center; gap: 6px;">
        Mis Favoritos <img src="imagenes/c.png" alt="Favoritos" class="icono-png-inline">
      </h3>
      <span style="cursor:pointer; font-size:1.2rem;" onclick="toggleFavoritos()">&times;</span>
    </div>
    <div class="cuerpo-panel" id="items-favoritos"></div>
  </div>

  <script src="app.js"></script>
  <script>
    function toggleMenuLateral() {
      const panel = document.getElementById('panel-menu-lateral');
      panel.classList.toggle('activo');
    }
  </script>
</body>
</html>
